name: Publish to npm

on:
  push:
    # `v0.6` is the SvelteKit 2 maintenance line (see README)
    branches: [main, v0.6]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # pinned to the Bun version the suite is verified against (see test.yml);
          # a release should never be gated on whatever `latest` happens to be
          bun-version: '1.4.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      # Publishes any version that isn't on npm yet, under a dist-tag derived from it:
      # - prereleases (`0.7.0-next.3`) go to their prerelease id (`next`), so the
      #   SvelteKit 3 line never becomes the default install before Kit 3 is stable
      # - a release newer than `latest` becomes `latest`
      # - a release older than `latest` (a patch on a maintenance branch, e.g. `0.6.2`
      #   for SvelteKit 2 after `0.7.0` is out) goes to `v<major>.<minor>` (`v0.6`)
      #   instead of moving `latest` backwards
      - name: Determine version and dist-tag
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "svelte-kit-bun@$VERSION" version >/dev/null 2>&1; then
            echo "svelte-kit-bun@$VERSION is already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(npm view svelte-kit-bun dist-tags.latest 2>/dev/null || echo "0.0.0")
          TAG=$(VERSION="$VERSION" LATEST="$LATEST" bun -e '
            const { VERSION: version, LATEST: latest } = process.env;
            const prerelease = version.split("-")[1];
            if (prerelease) console.log(prerelease.split(".")[0]);
            else if (Bun.semver.order(version, latest) > 0) console.log("latest");
            else console.log(`v${version.split(".").slice(0, 2).join(".")}`);
          ')

          echo "Publishing svelte-kit-bun@$VERSION with dist-tag '$TAG' (latest is $LATEST)"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish --tag "${{ steps.release.outputs.tag }}"
