name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs under Vitest, never `bun test` (Bun's runner has no
        # `vi.stubGlobal`). `1.3.14` and `1.4.2` are the pinned, known-good Bun
        # minors (their compiled executables differ in layout, e.g. for the Windows
        # branding post-processing); `latest` runs alongside them so upstream drift
        # shows up as a failure on the `latest` job rather than breaking a pinned one.
        bun-version: ['1.3.14', '1.4.2', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint and format check
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      # builds the SvelteKit 3 fixture app and runs the compiled single-file executable
      - name: Integration tests
        run: bun run test:integration
