name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs under Vitest, never `bun test` (Bun's runner has no
        # `vi.stubGlobal`). `1.3.14` is the pinned, known-good Bun for Vitest 4;
        # `latest` runs alongside it so upstream drift shows up as a failure on the
        # `latest` job rather than silently breaking the pinned one.
        bun-version: ['1.3.14', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      # builds the SvelteKit 3 fixture app and runs the compiled single-file executable
      - name: Integration tests
        run: bun run test:integration
